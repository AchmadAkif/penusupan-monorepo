<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="300" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <rect width="300" height="200" rx="16" fill="url(#cardGrad)" />
  
  <!-- Subtle decorative shapes -->
  <circle cx="260" cy="40" r="50" fill="url(#goldAccent)" opacity="0.15" />
  <circle cx="40" cy="160" r="40" fill="#3b82f6" opacity="0.1" />

  <!-- Icons representation -->
  <rect x="24" y="24" width="36" height="36" rx="8" fill="#ca8a04" fill-opacity="0.2" stroke="#ca8a04" stroke-width="1.5" />
  <path d="M42 34 L48 48 L36 48 Z" fill="#ca8a04" />

  <text x="70" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">
    Banjarnegara
  </text>
  <text x="70" y="52" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="10">
    Kec. Pejawaran
  </text>

  <!-- Mini Chart / Activity bars -->
  <g transform="translate(24, 80)">
    <rect x="0" y="50" width="28" height="40" rx="4" fill="#3b82f6" opacity="0.8" />
    <rect x="36" y="30" width="28" height="60" rx="4" fill="#ca8a04" />
    <rect x="72" y="15" width="28" height="75" rx="4" fill="#10b981" />
    <rect x="108" y="35" width="28" height="55" rx="4" fill="#f59e0b" opacity="0.8" />
    <rect x="144" y="20" width="28" height="70" rx="4" fill="#8b5cf6" opacity="0.8" />
    <rect x="180" y="45" width="28" height="45" rx="4" fill="#ec4899" opacity="0.8" />
    <rect x="216" y="25" width="28" height="65" rx="4" fill="#06b6d4" opacity="0.8" />
  </g>
</svg>
