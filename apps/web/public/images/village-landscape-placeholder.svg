<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad2" x1="300" y1="0" x2="300" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <linearGradient id="terrace1" x1="0" y1="200" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="terrace2" x1="0" y1="260" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="400" rx="24" fill="url(#skyGrad2)" />

  <!-- Sun -->
  <circle cx="480" cy="90" r="45" fill="#fde047" />
  <circle cx="480" cy="90" r="60" fill="#fde047" opacity="0.25" />

  <!-- Mountain in background -->
  <path d="M60 280 L220 120 L380 280 Z" fill="#64748b" opacity="0.4" />
  <path d="M260 280 L440 90 L620 280 Z" fill="#475569" opacity="0.35" />

  <!-- Terraces / Hills -->
  <path d="M-20 400 C 100 260, 280 320, 620 240 L620 400 Z" fill="url(#terrace1)" />
  <path d="M-20 400 C 180 310, 360 280, 620 320 L620 400 Z" fill="url(#terrace2)" />

  <!-- Plantation crop rows -->
  <path d="M40 370 Q 200 320 400 340" stroke="#ca8a04" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />
  <path d="M80 390 Q 240 340 440 360" stroke="#ca8a04" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Badge / Label -->
  <g transform="translate(24, 24)">
    <rect width="180" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="90" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      🌾 Pertanian Dataran Tinggi
    </text>
  </g>
</svg>
