<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="valleySky" x1="300" y1="0" x2="300" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f2b3e" />
    </linearGradient>
    <linearGradient id="contourGrad" x1="0" y1="200" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <!-- Dark Atmospheric Background -->
  <rect width="600" height="500" rx="28" fill="url(#valleySky)" />

  <!-- Topographic Contour Curves (Decorative) -->
  <path d="M-50 180 Q 150 120 300 210 T 650 170" stroke="rgba(202, 138, 4, 0.25)" stroke-width="1.5" fill="none" />
  <path d="M-50 220 Q 180 160 320 250 T 650 210" stroke="rgba(202, 138, 4, 0.2)" stroke-width="1.5" fill="none" />
  <path d="M-50 260 Q 200 200 350 290 T 650 250" stroke="rgba(202, 138, 4, 0.15)" stroke-width="1.5" fill="none" />
  <path d="M-50 300 Q 220 240 380 330 T 650 290" stroke="rgba(202, 138, 4, 0.1)" stroke-width="1.5" fill="none" />

  <!-- Valley Hills (Background layer) -->
  <path d="M0 320 Q 160 210 320 280 T 600 240 L 600 500 L 0 500 Z" fill="#047857" opacity="0.4" />
  
  <!-- Valley Hills (Foreground layer) -->
  <path d="M0 380 C 140 280, 260 360, 420 310 Q 520 280 600 340 L 600 500 L 0 500 Z" fill="url(#contourGrad)" />

  <!-- Agricultural Terraces Lines -->
  <path d="M40 430 Q 220 370 440 400" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <path d="M80 460 Q 260 410 520 440" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Map Pin / Target Marker -->
  <g transform="translate(300, 250)">
    <!-- Pulse Ring -->
    <circle cx="0" cy="0" r="32" fill="#ca8a04" opacity="0.2">
      <animate attributeName="r" values="24;42;24" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#ca8a04" stroke-width="3" />
    <circle cx="0" cy="0" r="6" fill="#fde047" />
  </g>

  <!-- Top Badge: Coordinates Overlay -->
  <g transform="translate(32, 32)">
    <rect width="250" height="64" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="18" y="28" fill="#ca8a04" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
      KOORDINAT GEOGRAFIS RESMI
    </text>
    <text x="18" y="48" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="600">
      -7.246117°, 109.797028°
    </text>
  </g>

  <!-- Bottom Badge: Altitude / Topography -->
  <g transform="translate(32, 404)">
    <rect width="210" height="64" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(202, 138, 4, 0.3)" />
    <text x="18" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">
      KETINGGIAN WILAYAH
    </text>
    <text x="18" y="48" fill="#fde047" font-family="system-ui, sans-serif" font-size="15" font-weight="800">
      ± 820 MDPL (Lembah)
    </text>
  </g>
</svg>
