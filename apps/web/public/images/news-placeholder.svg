<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="newsHortiSky" x1="300" y1="0" x2="300" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="newsHortiHills" x1="0" y1="200" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="20" fill="url(#newsHortiSky)" />
  <circle cx="500" cy="80" r="40" fill="#facc15" opacity="0.9" />

  <!-- Mountain Silhouette -->
  <path d="M40 280 L200 130 L360 280 Z" fill="#64748b" opacity="0.4" />
  <path d="M220 280 L400 110 L580 280 Z" fill="#475569" opacity="0.35" />

  <!-- Terrace Farmland -->
  <path d="M-20 400 C 120 280, 300 340, 620 250 L620 400 Z" fill="url(#newsHortiHills)" />
  <path d="M-20 400 C 200 320, 380 290, 620 330 L620 400 Z" fill="#15803d" />

  <!-- Planted Rows -->
  <path d="M50 360 Q 220 310 420 330" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.8" />
  <path d="M90 380 Q 260 330 460 350" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.8" />

  <!-- Overlay Tag -->
  <g transform="translate(24, 24)">
    <rect width="130" height="32" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="65" y="20" fill="#fde047" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      🌾 Pertanian
    </text>
  </g>
</svg>
