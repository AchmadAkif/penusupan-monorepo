<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roadSky" x1="300" y1="0" x2="300" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="20" fill="url(#roadSky)" />

  <!-- Landscape hills on sides -->
  <path d="M0 240 Q 180 180 340 260 L 0 350 Z" fill="#15803d" opacity="0.6" />
  <path d="M600 220 Q 420 180 260 260 L 600 350 Z" fill="#166534" opacity="0.6" />

  <!-- Winding Asphalt Road -->
  <path d="M 280 180 L 320 180 L 460 400 L 140 400 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
  
  <!-- Dashed Road center lines -->
  <line x1="300" y1="180" x2="300" y2="400" stroke="#facc15" stroke-width="4" stroke-dasharray="14 14" />

  <!-- Road markers & safety barriers -->
  <circle cx="160" cy="380" r="4" fill="#ef4444" />
  <circle cx="440" cy="380" r="4" fill="#ef4444" />

  <!-- Overlay Tag -->
  <g transform="translate(24, 24)">
    <rect width="150" height="32" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="75" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      🏗️ Pembangunan
    </text>
  </g>
</svg>
