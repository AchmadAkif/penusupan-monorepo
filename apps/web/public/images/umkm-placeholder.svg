<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141E3C" />
      <stop offset="50%" stop-color="#19264E" />
      <stop offset="100%" stop-color="#0E162C" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3C978" />
      <stop offset="50%" stop-color="#D4A359" />
      <stop offset="100%" stop-color="#B68535" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Overlay -->
    <linearGradient id="subtleGrid" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Card Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />

  <!-- Ambient Light Circles -->
  <circle cx="500" cy="80" r="140" fill="url(#goldGrad)" opacity="0.12" filter="url(#glow)" />
  <circle cx="100" cy="320" r="160" fill="#3B82F6" opacity="0.08" filter="url(#glow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="320" x2="600" y2="320" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
  </g>

  <!-- Central Storefront / UMKM Icon Container -->
  <g transform="translate(300, 160)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="64" fill="#ffffff" fill-opacity="0.04" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 4" />
    <!-- Inner Circle -->
    <circle cx="0" cy="0" r="50" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />
    
    <!-- Storefront Icon in Gold -->
    <g transform="translate(-24, -24)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Store Roof / Awning -->
      <path d="M4 14 L24 4 L44 14" />
      <path d="M4 14 L8 24 L16 24 L16 14 M16 24 L24 24 L24 14 M24 24 L32 24 L32 14 M32 24 L40 24 L44 14" />
      
      <!-- Store Body & Door -->
      <path d="M7 24 V42 C7 43.1 7.9 44 9 44 H39 C40.1 44 41 43.1 41 42 V24" />
      <path d="M19 44 V32 H29 V44" />
      <circle cx="34" cy="33" r="1.5" fill="url(#goldGrad)" />
    </g>

    <!-- Sparkle Accent Top Right -->
    <path d="M42 -30 L45 -22 L53 -19 L45 -16 L42 -8 L39 -16 L31 -19 L39 -22 Z" fill="url(#goldGrad)" opacity="0.8" />
  </g>

  <!-- Bottom Labels -->
  <text x="300" y="272" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="0.5">
    UMKM DESA PENUSUPAN
  </text>
  <text x="300" y="296" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.3">
    Potensi Usaha &amp; Ekonomi Kreatif Warga
  </text>

  <!-- Top Left Pill Badge -->
  <g transform="translate(36, 36)">
    <rect width="138" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="url(#goldGrad)" />
    <text x="26" y="18" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">
      Katalog Usaha Desa
    </text>
  </g>
</svg>
